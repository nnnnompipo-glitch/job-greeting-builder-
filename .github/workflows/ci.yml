name: Test skill app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: skills/boss-greeting/assets/app
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify complete install payload
        run: |
          $required = @('scripts/bootstrap.ps1','scripts/install.mjs','scripts/codex.mjs','scripts/configure-host.mjs','scripts/import-document.ps1','server/index.mjs','server/providers.mjs','server/settings.mjs','server/imports.mjs','extension/manifest.json','extension/platforms.cjs','templates/profile.example.md')
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing runtime file: $file" }
          }
          if (-not (Test-Path -LiteralPath '../../SKILL.md' -PathType Leaf)) { throw 'Missing SKILL.md' }
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $extensionVersion = (Get-Content -LiteralPath extension/manifest.json -Raw | ConvertFrom-Json).version
          if ($version -ne $extensionVersion) { throw 'Application and extension versions differ' }
          $changelog = Get-Content -LiteralPath '../../../../CHANGELOG.md' -Raw -Encoding UTF8
          if ($changelog -notmatch ('(?m)^##\s+(?:\[' + [regex]::Escape($version) + '\]|' + [regex]::Escape($version) + ')(?=\s|$)')) { throw 'Current version is missing from CHANGELOG.md' }
      - name: Check JavaScript syntax
        run: |
          Get-ChildItem -LiteralPath server,scripts -File | Where-Object { $_.Extension -eq '.mjs' } | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $($_.Name)" }
          }
      - name: Run behavior tests
        run: node --test tests/*.test.mjs extension/tests/*.test.cjs
